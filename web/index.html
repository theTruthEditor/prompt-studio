<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prompt Studio · 提示词工作台</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #0f1117; color: #e6e6e6;
      }
      main { text-align: center; padding: 2rem; }
      h1 { font-size: 2rem; margin: 0 0 .5rem; }
      h1 span { background: linear-gradient(90deg, #6ee7b7, #60a5fa); -webkit-background-clip: text; background-clip: text; color: transparent; }
      p  { color: #9ca3af; margin: .4rem 0; }
      .status {
        display: inline-block; margin-top: 1.4rem; padding: .45rem 1rem;
        border-radius: 999px; font-size: .9rem; background: #1f2937; color: #9ca3af;
      }
      .status.ok   { color: #6ee7b7; }
      .status.bad  { color: #f87171; }
      footer { margin-top: 2.5rem; font-size: .8rem; color: #6b7280; }
    </style>
  </head>
  <body>
    <main>
      <h1>Prompt <span>Studio</span></h1>
      <p>像管理代码一样管理写给 AI 的提示词。</p>
      <p>存储 · 标签 · 搜索 · 一键提交 AI 优化</p>
      <span id="api-status" class="status">API 探测中…</span>
      <footer>全栈转型学习项目 · 阶段 3 上线运维的活体证据</footer>
    </main>
    <script>
      // 探针：匿名请求一个受保护接口。网关→后端→守卫整条链路活着，
      // 一定会回 401（未登录）；链路任何一环断了则是网络错误。
      const el = document.getElementById('api-status');
      fetch('/api/prompts')
        .then((r) => {
          el.textContent = r.status === 401
            ? 'API 链路正常（未登录 401，登录后可用）'
            : 'API 已响应 · HTTP ' + r.status;
          el.classList.add(r.status === 401 ? 'ok' : 'bad');
        })
        .catch(() => {
          el.textContent = 'API 链路不通';
          el.classList.add('bad');
        });
    </script>
  </body>
</html>
