# 自动部署流水线：push 到 main → VM 上的自托管 runner 执行
# 为什么 runner 装在 VM 里：GitHub 云端的 runner 够不着家里 NAT 后面的 VM；
# 而装在 VM 里的 runner 是"出站轮询"——它主动找 GitHub 领活，
# 不需要任何人能连进这台机器（不占任何入站端口）
name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    # self-hosted = 只在装了我们 runner 的机器上执行
    runs-on: [self-hosted]
    steps:
      - name: 拉代码并重建整套栈
        run: |
          cd ~/prompt-studio
          # 家里到 GitHub 的链路间歇抽风（TLS 握手被掐），最多重试 5 次，每次退避 15 秒
          pulled=""
          for i in 1 2 3 4 5; do
            if git pull; then pulled=yes; break; fi
            echo "第 $i 次 git pull 失败，15 秒后重试……"
            sleep 15
          done
          # 兜底哨兵：5 次全挂就大声失败——绝不拿着旧代码装成部署成功（绿勾≠健康）
          if [ -z "$pulled" ]; then
            echo "::error::git pull 重试 5 次全失败，本次部署终止"
            exit 1
          fi
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
          docker image prune -f
