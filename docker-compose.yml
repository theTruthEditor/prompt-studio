services:
  db:
    image: postgres:16-alpine
    container_name: prompt-studio-db
    restart: unless-stopped        # ← 加这一行：除非你手动停它，否则 Docker 一启动它就跟着起
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prompt_studio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prompt-studio-redis
    restart: unless-stopped          # 和数据库同款策略：Docker 一启动它就跟着起
    ports:
      - "6379:6379"                  # Redis 的默认端口（对应 PG 的 5432）
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]   # 活性检查：对 Redis 喊一声 ping，回 PONG 才算健康
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: